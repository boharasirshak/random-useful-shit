[project]
name = "server"
version = "0.2.0"
description = "The shared API for Random Useful Shit tools: accounts, offline-first sync, RAG, and one router per tool."
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.161",
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "pgvector>=0.4",
    "pydantic-settings>=2.10",
    "google-auth[requests]>=2.40",
    "redis>=6.2",
    "fastembed>=0.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
